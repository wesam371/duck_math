<title>duck_math — رياضيات الثالث الإعدادي، خطوة بخطوة</title>

<style>
:root{
  --paper:#FBFBF8;--paper2:#F1F1EB;--white:#fff;
  --ink:#101010;--ink2:#4C4C48;--ink3:#8B8B84;
  --line:#D9D9D2;--red:#E3270E;--blue:#1D3FCC;--green:#0E7A3C;--amber:#B26A00;--magenta:#C0157A;--danger:#C81E1E;
  --accent:var(--red);--rule-w:2px;--rule:var(--rule-w) solid var(--ink);--hair:1px solid var(--line);
  --rad:0px;--hard:5px 5px 0 var(--ink);--fs:1;
  --grid:rgba(29,63,204,.09);--grid2:rgba(29,63,204,.15);
  --bar:3.5rem;--tab:3.6rem;--safe:env(safe-area-inset-bottom,0px);--rail:0px;--ban:0px;
  --sans:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  --g-live:linear-gradient(115deg,#0E7A3C,#12A05A 42%,#1D3FCC);
  --g-off:linear-gradient(115deg,#B71E0A,#E3270E 45%,#C0157A);
  --g-hero:linear-gradient(150deg,rgba(227,39,14,.10),rgba(29,63,204,.09) 55%,rgba(192,21,122,.08));
}
html{font-size:calc(16px * var(--fs));-webkit-text-size-adjust:100%;scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 .94rem/1.85 var(--sans);
  overflow-x:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
h1,h2,h3,h4{margin:0;font-weight:700;line-height:1.25;letter-spacing:-.01em;overflow-wrap:break-word}
p{margin:0;overflow-wrap:break-word}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
img,svg,canvas{max-width:100%}
::selection{background:var(--accent);color:var(--paper)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
*{scrollbar-width:thin;scrollbar-color:var(--ink) var(--paper2)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:var(--paper2)}
::-webkit-scrollbar-thumb{background:var(--ink);border:2px solid var(--paper2);border-radius:var(--rad)}
::-webkit-scrollbar-thumb:hover{background:var(--accent)}
.mono{font-family:var(--mono);direction:ltr;unicode-bidi:isolate;font-weight:500}
.dim{color:var(--ink3)}
[hidden]{display:none!important}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px),linear-gradient(var(--grid2) 1px,transparent 1px),linear-gradient(90deg,var(--grid2) 1px,transparent 1px);
  background-size:24px 24px,24px 24px,120px 120px,120px 120px}
.bg::after{content:'';position:absolute;inset:0;background:var(--g-hero);opacity:.55}
.kick{font:500 .62rem/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:.45rem;margin-bottom:.5rem}
.kick::before{content:'';width:.45rem;height:.45rem;background:var(--accent);flex-shrink:0}
.tag{display:inline-flex;align-items:center;gap:.25rem;padding:.15rem .5rem;border:1px solid var(--ink);border-radius:var(--rad);font-size:.68rem;font-weight:600;background:var(--white);white-space:nowrap}
.tag.g{border-color:var(--green);color:var(--green)}.tag.r{border-color:var(--red);color:var(--red)}
.tag.a{border-color:var(--amber);color:var(--amber)}.tag.b{border-color:var(--blue);color:var(--blue)}.tag.m{border-color:var(--magenta);color:var(--magenta)}
.reveal{opacity:0;transform:translateY(14px);transition:opacity .55s cubic-bezier(.2,.8,.2,1),transform .55s cubic-bezier(.2,.8,.2,1);transition-delay:var(--d,0ms)}
.reveal.in{opacity:1;transform:none}

/* ══ الشريط العلوي ══ */
.ban{position:fixed;top:0;left:0;right:0;z-index:62;color:#fff;padding:.5rem .8rem;font-size:.78rem;font-weight:600;
  display:flex;gap:.5rem;align-items:center;justify-content:center;text-align:center;line-height:1.5}
.ban.info{background:var(--blue)}.ban.success{background:var(--green)}.ban.warn{background:var(--amber)}.ban.danger{background:var(--danger)}
.ban a{border-bottom:1px solid rgba(255,255,255,.7);white-space:nowrap}
.ban button{background:none;border:1px solid rgba(255,255,255,.6);color:#fff;width:1.6rem;height:1.6rem;flex-shrink:0;font-size:.8rem;line-height:1;border-radius:var(--rad)}
.app{position:fixed;top:var(--ban);left:0;right:0;height:var(--bar);z-index:60;background:var(--paper);border-bottom:var(--rule);
  display:flex;align-items:center;gap:.55rem;padding:0 .7rem}
.brand{display:flex;align-items:center;gap:.55rem;min-width:0;flex-shrink:1}
.mark{flex-shrink:0;display:grid;place-items:center}
.brand-t{min-width:0;line-height:1.1}
.brand-t b{display:block;font:700 .95rem var(--mono);letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-t small{font:500 .5rem var(--mono);letter-spacing:.18em;color:var(--ink3);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-nav{display:none}
.app-act{display:flex;align-items:center;gap:.35rem;margin-inline-start:auto;flex-shrink:0}
.ib{width:2.5rem;height:2.5rem;display:grid;place-items:center;border:var(--rule);border-radius:var(--rad);background:var(--white);transition:.15s;flex-shrink:0}
.ib:hover{background:var(--ink);color:var(--paper)}
.ib:active{transform:translate(1px,1px)}
.ib svg{width:1.05rem;height:1.05rem}
.ib.off{color:var(--ink3)}
.next-chip{display:none;align-items:center;gap:.35rem;height:2.5rem;padding:0 .6rem;border:var(--rule);border-radius:var(--rad);background:var(--white);font:600 .68rem var(--sans);white-space:nowrap}
.next-chip i{width:.45rem;height:.45rem;background:var(--amber);flex-shrink:0}

/* ══ التبويب السفلي ══ */
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:61;background:var(--paper);border-top:var(--rule);display:flex;padding-bottom:var(--safe)}
.tabs button{flex:1 1 0;min-width:0;height:var(--tab);background:none;border:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15rem;
  font:600 .6rem var(--sans);color:var(--ink2);position:relative;padding:0 .1rem;transition:color .15s}
.tabs button svg{width:1.2rem;height:1.2rem;flex-shrink:0}
.tabs button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs button.on{color:var(--accent)}
.tabs button.on::before{content:'';position:absolute;top:0;left:16%;right:16%;height:3px;background:var(--accent)}

/* ══ الهيكل ══ */
.shell{position:relative;z-index:1;padding-top:calc(var(--bar) + var(--ban));padding-bottom:calc(var(--tab) + var(--safe) + 1.2rem);padding-inline-start:var(--rail)}
.view{display:none;max-width:74rem;margin:0 auto;padding:.9rem .8rem 1rem}
.view.on{display:block;animation:vIn .3s cubic-bezier(.2,.8,.2,1)}
@keyframes vIn{from{opacity:0;transform:translateY(8px)}}
.head{position:relative;padding-top:.9rem;margin-bottom:1rem}
.head::before{content:'';position:absolute;top:0;left:0;right:0;height:var(--rule-w);background:var(--ink)}
.head .num{font:700 1.5rem/1 var(--mono);color:var(--accent);display:block;margin-bottom:.3rem}
.head h2{font-size:1.35rem;margin-bottom:.3rem}
.head p{font-size:.82rem;color:var(--ink2)}
.panel{background:var(--white);border:var(--rule);border-radius:var(--rad);padding:.9rem}
.panel+.panel{margin-top:.9rem}
.sub{font:500 .62rem var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin:1rem 0 .55rem;display:flex;align-items:center;gap:.5rem}
.sub:first-child{margin-top:0}
.sub::after{content:'';flex:1;height:1px;background:var(--line)}
.note{border:1px dashed var(--line);border-radius:var(--rad);background:var(--paper);padding:.6rem .7rem;font-size:.76rem;color:var(--ink2);line-height:1.75}
.note b{color:var(--ink)}

/* ══ الأدوات ══ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:2.75rem;padding:.6rem .95rem;border:var(--rule);border-radius:var(--rad);
  background:var(--white);font-weight:600;font-size:.84rem;transition:background .15s,color .15s,transform .1s,box-shadow .15s;text-align:center}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn:active{transform:translate(1px,1px)}
.btn.p{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:3px 3px 0 var(--ink)}
.btn.p:hover{background:var(--ink);border-color:var(--ink);box-shadow:4px 4px 0 var(--accent)}
.btn.d{border-color:var(--danger);color:var(--danger)}.btn.d:hover{background:var(--danger);color:#fff}
.btn.sm{min-height:2.4rem;padding:.45rem .7rem;font-size:.76rem}
.btn.w{width:100%}
.btn:disabled{opacity:.42;cursor:not-allowed;transform:none!important;box-shadow:none!important}
.btn svg{width:1rem;height:1rem;flex-shrink:0}
.f{width:100%;min-height:2.75rem;padding:.6rem .7rem;border:var(--rule);border-radius:var(--rad);background:var(--white);font-size:1rem;transition:border-color .15s}
.f:focus{outline:none;border-color:var(--accent)}
textarea.f{resize:vertical;line-height:1.8;min-height:4.6rem}
select.f{cursor:pointer;font-size:.9rem;font-weight:500}
.fg{display:flex;flex-direction:column;gap:.3rem;margin-bottom:.7rem}
.fg>label{font-size:.74rem;font-weight:600;color:var(--ink2);display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.fg>label b{font:500 .68rem var(--mono);color:var(--accent)}
.row{display:flex;gap:.5rem;flex-wrap:wrap}.row>*{flex:1 1 8rem;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.sw{display:flex;align-items:center;gap:.5rem;min-height:2.75rem;padding:.55rem .65rem;border:1px solid var(--ink);border-radius:var(--rad);background:var(--white);font-size:.76rem;font-weight:500;text-align:start;transition:.15s;width:100%}
.sw:hover{background:var(--paper2)}
.sw i{width:1.05rem;height:1.05rem;border:2px solid var(--ink);flex-shrink:0;display:grid;place-items:center;font-style:normal;font-size:.68rem;line-height:1;color:#fff;transition:.15s}
.sw.on i{background:var(--accent);border-color:var(--accent)}.sw.on i::after{content:'✓'}
.tgs{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;margin-bottom:.7rem}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;background:var(--ink);outline:none;cursor:pointer;margin:.75rem 0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:1.5rem;height:1.5rem;background:var(--accent);border:2px solid var(--ink);cursor:grab}
input[type=range]::-moz-range-thumb{width:1.25rem;height:1.25rem;background:var(--accent);border:2px solid var(--ink);border-radius:0}
.seg{display:flex;border:var(--rule);border-radius:var(--rad);overflow:hidden}
.seg button{flex:1;min-height:2.6rem;padding:.5rem .25rem;background:var(--white);border:none;border-inline-start:1px solid var(--ink);font:600 .76rem var(--sans)}
.seg button:first-child{border-inline-start:none}
.seg button.on{background:var(--ink);color:var(--paper)}
.chips{display:flex;gap:.4rem;overflow-x:auto;padding:.15rem .1rem .5rem;-webkit-overflow-scrolling:touch}
.chip{flex-shrink:0;min-height:2.35rem;padding:.45rem .75rem;border:1px solid var(--ink);border-radius:var(--rad);background:var(--white);font-size:.76rem;font-weight:600;white-space:nowrap}
button.chip:hover{background:var(--ink);color:var(--paper)}
.chip.on{background:var(--ink);color:var(--paper)}
.search{display:flex;align-items:center;gap:.5rem;border:var(--rule);border-radius:var(--rad);background:var(--white);padding:0 .65rem;flex:1 1 10rem;min-height:2.75rem}
.search:focus-within{border-color:var(--accent)}
.search svg{width:.95rem;height:.95rem;color:var(--ink3);flex-shrink:0}
.search input{flex:1;border:none;background:none;outline:none;font-size:1rem;min-width:0}
.toolbar{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-bottom:.6rem}
.toolbar select{width:auto;min-width:7rem;flex:0 0 auto}

/* ══ البطل ══ */
.hero{position:relative;border:var(--rule);border-radius:var(--rad);background:var(--white);box-shadow:var(--hard);overflow:hidden;margin-bottom:1rem}
.hero-in{position:relative;padding:1.1rem .95rem}
.hero h1{font-size:clamp(1.7rem,7vw,3.1rem);line-height:1.12;margin-bottom:.55rem}
.hero h1 span{color:var(--accent)}
.hero .lead{font-size:.84rem;color:var(--ink2);margin-bottom:.85rem}
.hero .lead b{font-family:var(--mono);color:var(--ink)}
.hero-cta{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.7rem}
.hero-cta .btn{flex:1 1 9rem}
.stats{display:grid;grid-template-columns:1fr 1fr;border-top:var(--rule);margin-top:.3rem}
.stats>div{padding:.6rem .5rem;border-inline-start:var(--hair);border-top:var(--hair)}
.stats>div:nth-child(odd){border-inline-start:none}
.stats>div:nth-child(-n+2){border-top:none}
.stats b{display:block;font:700 1.2rem/1.2 var(--mono)}
.stats span{font-size:.64rem;color:var(--ink3)}
.spec{border:var(--rule);border-radius:var(--rad);background:var(--paper);padding:.75rem;margin-bottom:1rem;position:relative}
.spec-top{display:flex;justify-content:space-between;align-items:center;gap:.5rem;margin-bottom:.5rem}
.spec-no{font:500 .58rem var(--mono);letter-spacing:.14em;color:var(--ink3)}
.spec-body{transition:opacity .3s}
.spec-body.fade{opacity:0}
.dstep{display:grid;grid-template-columns:1.6rem 1fr;gap:.5rem;padding:.4rem 0;border-top:var(--hair)}
.dstep:first-of-type{border-top:none}
.dstep b{font:700 .78rem/1.9 var(--mono);color:var(--accent)}
.dstep small{display:block;font-size:.66rem;color:var(--ink3)}
.dans{background:var(--ink);color:var(--paper);border-radius:var(--rad);padding:.5rem .6rem;margin-top:.5rem}
.dans .math{color:var(--paper)}
.dans small{color:#FF7A66;font:500 .58rem var(--mono);letter-spacing:.1em}
.spec-cap{font:500 .58rem var(--mono);letter-spacing:.1em;color:var(--ink3);margin-top:.5rem;text-align:center}

/* ══ عارض الرياضيات ══ */
.math{direction:ltr;unicode-bidi:isolate;text-align:center;font-family:var(--mono);font-size:1.02rem;line-height:2.3;
  overflow-x:auto;overflow-y:hidden;padding:.25rem .1rem;white-space:nowrap;max-width:100%;overscroll-behavior-x:contain}
.math.start{text-align:start}
.math.inline{display:inline;overflow:visible;white-space:normal;padding:0}
.m-n{font-weight:500}
.m-vr{font-family:var(--sans);font-style:italic;font-weight:700;padding:0 .06rem}
.m-op{padding:0 .32rem;color:var(--ink2)}
.m-eq{padding:0 .42rem;font-weight:700}
.m-sup{font-size:.7em;vertical-align:super;line-height:0}
.m-fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .18rem;line-height:1.3;font-size:.92em}
.m-fr>span{padding:0 .28rem}
.m-fr>span:first-child{border-bottom:1.5px solid currentColor}
.m-rt{display:inline-flex;align-items:flex-start;margin:0 .12rem}
.m-rt>b{font-weight:400;font-size:1.12em;line-height:1.1}
.m-rt>span{border-top:1.5px solid currentColor;padding:.06rem .22rem 0 .12rem;margin-top:.18rem}
.m-fn{font-weight:700}
.m-abs{padding:0 .12rem;border-inline:1.5px solid currentColor;margin:0 .12rem}
.m-txt{font-family:var(--sans);font-size:.85em;padding:0 .22rem}
.m-spc{display:inline-block;width:.85rem}
.m-lbl{font-family:var(--sans);font-size:.8em;color:var(--ink2);padding-inline-end:.35rem}

/* ══ الحل ══ */
.solve-grid{display:block}
.lbl{display:flex;justify-content:space-between;align-items:center;font-size:.74rem;font-weight:600;color:var(--ink2);margin:.85rem 0 .45rem}
.lbl:first-child{margin-top:0}
.lbl .mono{font-size:.6rem}
.keypad{display:grid;grid-template-columns:repeat(6,1fr);gap:.3rem;margin-top:.55rem}
.key{min-height:2.5rem;border:1px solid var(--ink);border-radius:var(--rad);background:var(--white);font:500 .85rem var(--mono);transition:.12s;padding:0}
.key:hover{background:var(--ink);color:var(--paper)}
.key:active{transform:translate(1px,1px)}
.hint{font-size:.72rem;color:var(--ink3);margin-top:.6rem;line-height:1.75}
.mini{display:grid;grid-template-columns:repeat(3,1fr);margin-top:.85rem;border-top:var(--rule)}
.mini>div{padding:.55rem .3rem 0;text-align:center;border-inline-start:var(--hair)}
.mini>div:first-child{border-inline-start:none}
.mini b{display:block;font:700 1.15rem var(--mono);color:var(--accent)}
.mini span{font-size:.62rem;color:var(--ink3)}
.steps{min-height:22rem}
.sol-head{display:flex;justify-content:space-between;align-items:flex-start;gap:.6rem;flex-wrap:wrap;padding-bottom:.7rem;border-bottom:var(--rule);margin-bottom:.7rem}
.sol-head h3{font-size:1.05rem;margin-bottom:.35rem}
.verified{display:inline-flex;align-items:center;gap:.35rem;padding:.25rem .55rem;border:1.5px solid var(--green);border-radius:var(--rad);color:var(--green);font-size:.7rem;font-weight:600}
.verified svg{width:.8rem;height:.8rem}
.pbox{border:var(--hair);border-radius:var(--rad);background:var(--paper);padding:.6rem .7rem;margin-bottom:.4rem}
.pbox small{display:block;font-size:.64rem;color:var(--ink3);margin-bottom:.15rem}
.pbox .plain{text-align:center;font-size:.76rem;color:var(--ink2);margin-top:.25rem;white-space:normal;overflow-wrap:anywhere}
.step{display:grid;grid-template-columns:2.1rem 1fr;gap:.6rem;padding:.75rem 0;border-top:var(--hair);animation:sIn .38s cubic-bezier(.2,.8,.2,1) both}
.step:first-child{border-top:none}
@keyframes sIn{from{opacity:0;transform:translateY(10px)}}
.step-n{font:700 1.05rem/1.7 var(--mono);color:var(--accent)}
.step-t{font-weight:600;font-size:.84rem;margin-bottom:.2rem}
.step-note{font-size:.74rem;color:var(--ink2);margin-top:.2rem}
.tools{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center;padding:.7rem 0;border-top:var(--hair)}
.dots{display:flex;gap:.25rem;margin-inline-start:auto}
.dots i{width:.45rem;height:.45rem;background:var(--line);transition:.25s}
.dots i.on{background:var(--accent)}
.answer{background:var(--ink);color:var(--paper);border-radius:var(--rad);padding:.9rem;margin-top:.5rem}
.answer .lab{font:500 .62rem var(--mono);letter-spacing:.12em;color:#FF7A66;margin-bottom:.3rem}
.answer .math{color:var(--paper);font-size:1.12rem}

var KB=[
{k:['جمع','طرح','اشارات','إشارات','نسبية'],a:'**الجمع والطرح في الأعداد النسبية:**\nموجب + موجب = موجب، وسالب + سالب = سالب.\nعند اختلاف الإشارة نطرح القيمتين ونأخذ إشارة الأكبر قيمة.\nطرح عدد = جمع معاكسه: $5-(-3)=8$\nوفي الكسور نوحّد المقامات ثم نجمع البسوط.'},
{k:['نقل','حدود','اشارة','إشارة','نعكس','طرفين'],a:'**لماذا نعكس الإشارة عند النقل؟**\nالمعادلة ميزان: ما تفعله في طرف تفعله في الآخر. «نقل» حدّ يعني طرحه من الطرفين، فيظهر في الطرف الآخر بإشارة معاكسة.\nفي $3س+7=22$ نطرح 7 من الطرفين فيصبح $3س=15$.'},
{k:['جملة','معادلتين','مجهولين','حذف','تعويض'],a:'**جملة معادلتين بمجهولين** تُحلّ بطريقتين:\n1) **الحذف**: نضرب كل معادلة بعدد يجعل معاملي أحد المجهولين متساويين، ثم نجمع أو نطرح ليُحذف.\n2) **التعويض**: نستخرج مجهولًا من إحداهما ونعوّضه في الأخرى.\nبيانيًا: الحل نقطة تقاطع مستقيمين.'},
{k:['مميز','Δ','ثانية','تربيعية','قانون'],a:'**معادلة الدرجة الثانية** أ س² + ب س + ج = 0:\nالمميّز Δ = ب² − 4أج.\nΔ > 0 حلّان، Δ = 0 حلّ مضاعف، Δ < 0 لا حل في ℝ.\nالقانون: س = (−ب ± √Δ) / (2أ).'},
{k:['تحليل','عامل','متطابقة','مربعين','ثلاثي'],a:'**التحليل** يبدأ بالعامل المشترك الأكبر، ثم المتطابقات:\nأ² − ب² = (أ − ب)(أ + ب)\nأ² ± 2أب + ب² = (أ ± ب)²\nوللثلاثي س² + ب س + ج نبحث عن عددين مجموعهما ب وجداؤهما ج.'},
{k:['نشر','توزيع','اقواس','أقواس'],a:'**النشر** توزيع الضرب على الجمع:\n(س+3)(س+2) = س² + 2س + 3س + 6 = س² + 5س + 6\nالنشر والتحليل عمليتان متعاكستان.'},
{k:['sin','cos','tan','مثلثية','نسب'],a:'**sin_cos_tan في المثلث القائم:**\nsin = المقابل ÷ الوتر\ncos = المجاور ÷ الوتر\ntan = المقابل ÷ المجاور\nوالعلاقة: sin² + cos² = 1، و tan = sin ÷ cos.\nالوتر مقابل الزاوية القائمة وهو الأطول.'},
{k:['طاليس','توازي'],a:'**نظرية طاليس:** في المثلث ABC، إذا كان M على [AB] و N على [AC] و (MN) // (BC) فإن:\nAM/AB = AN/AC = MN/BC\nوعكسها يُثبت التوازي.'},
{k:['فيثاغورس','قائم','وتر'],a:'**فيثاغورس** في المثلث القائم فقط: أ² + ب² = ج² حيث ج الوتر.\nللوتر: اجمع المربّعين ثم خذ الجذر.\nلضلع قائم: اطرح مربّع المعلوم من مربّع الوتر ثم خذ الجذر.'},
{k:['شعاع','احداثي','إحداثي','معلم','منتصف','مسافة'],a:'**في معلم متعامد ممنظم:**\nإحداثيا الشعاع AB: (x_B − x_A , y_B − y_A)\nالمنتصف: ((x_A+x_B)/2 , (y_A+y_B)/2)\nالمسافة: √((x_B−x_A)² + (y_B−y_A)²)'},
{k:['دالة','صورة','سابقة','تآلفية','خطية'],a:'**الدالة التآلفية** f(س) = أ س + ب:\n**الصورة**: نعوّض العدد في العبارة.\n**السابقة**: نحلّ أ س + ب = العدد.\nتمثيلها مستقيم ميله أ وترتيبه إلى الأصل ب.'},
{k:['جذر','تبسيط','مربع'],a:'**تبسيط الجذر:** ابحث عن أكبر مربع كامل يقسم العدد.\n√72 = √(36×2) = 6√2\nالخاصية: √(أ×ب) = √أ × √ب.'},
{k:['متراجحة','اكبر','أصغر','اتجاه'],a:'**المتراجحات** تُحلّ كالمعادلات بالجمع والطرح من الطرفين، مع قاعدة حاسمة: عند الضرب أو القسمة على عدد **سالب** نعكس الاتجاه.\n−2س > 6 ⟹ س < −3'},
{k:['مخروط','هرم','كرة','أسطوانة','حجم','مجسم'],a:'**الحجوم:**\nأسطوانة: πr²هـ\nمخروط: (1/3)πr²هـ\nهرم: (1/3) × مساحة القاعدة × الارتفاع\nكرة: (4/3)πr³ ومساحتها 4πr²'},
{k:['متوسط','وسيط','منوال','مدى','احصاء','إحصاء'],a:'**الإحصاء:**\nالمتوسط = المجموع ÷ العدد.\nالوسيط = القيمة الوسطى بعد الترتيب.\nالمنوال = الأكثر تكرارًا.\nالمدى = أكبر قيمة − أصغر قيمة.'},
{k:['ترتيب','عمليات','اسبقية'],a:'**ترتيب العمليات:** الأقواس ← القوى والجذور ← الضرب والقسمة ← الجمع والطرح.\n12 + 5 × 3 = 27 وليس 51.'},
{k:['مجهول','حرف','رمز'],a:'**أي حرف يصلح مجهولًا:** س، ص، ع، x، y، n… المحرّك يتعرّف على الحرف الذي تكتبه ويستعمله في كل الخطوات.\nولجملة معادلتين استعمل حرفين وافصل بـ ؛'}];

function solveProblem(text){

  if((t.match(/=/g)||[]).length>=2&&/[;؛\n]/.test(raw))return solveSystem(t);
  if(/طاليس|thales/i.test(t))return solveThales(t);
  if(/sin|cos|tan|مثلثية/i.test(t))return solveTrig(t);
  if(/منتصف|مسافة|شعاع|إحداثي|احداثي/.test(t)&&/\(\s*-?\d/.test(t))return solveVector(t);
  if(/سابقة|صورة/.test(t)||/[A-Za-z]\s*\(\s*[A-Za-z\u0621-\u064A]\s*\)\s*=/.test(t))return solveFunction(t);
  if(/حلل|تحليل/.test(t))return solveFactor(t);
  if(/انشر|وسّع|وسع|متطابقة/.test(t))return solveExpand(t);
  var rs=runs(t);
  if(best(rs,function(r){return r.rel&&r.rel.v!=='='&&r.vars.length>0}))return solveIneq(t);
  if(best(rs,function(r){return r.rel&&r.rel.v==='='&&r.vars.length>0}))return solveEquation(t);

  if(/مساحة|محيط/.test(t))return solveGeom(t);
  if(/فيثاغورس|قائم|الوتر/.test(t))return solvePyth(t);
  if(/%|٪|مئوية|المائة/.test(t))return solvePercent(t);
  if(/متوسط|وسيط|منوال|مدى|إحصاء|احصاء/.test(t))return solveStats(t);
  if(/√|جذر/.test(t)&&!best(rs,function(r){return r.vars.length>0}))return solveRadical(t);
  if(best(rs,function(r){return !r.rel&&r.vars.length>0}))return solveExpand(t);
