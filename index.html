SOL.linear=function(t){
var r=relation(t);if(!r)throw new E('اكتب معادلة بعلامة = مثل 3س + 7 = 22','rel');

var vs=varsOf(parse(toMath(r.left))).concat(varsOf(parse(toMath(r.right))));
vs=vs.filter(function(v,i){return vs.indexOf(v)===i});
if(!vs.length)throw new E('لا يوجد مجهول. اكتب مثل 3س + 7 = 22.','novar');
if(vs.length>1)throw new E('ظهر أكثر من مجهول ('+vs.join('، ')+'). لجمل المعادلات افصل بـ ؛','multi');
var vn=vs[0],L=side(r.left,vn,3),Rr=side(r.right,vn,3),D=P.sub(L,Rr);
if(P.deg(D)===2)return SOL.quad(t);
if(P.deg(D)>2)return SOL.cubic(t);
var l1=P.get(L,1),l0=P.get(L,0),r1=P.get(Rr,1),r0=P.get(Rr,0);
var head=M.poly(L,vn)+M.eq()+M.poly(Rr,vn);
var m1=[S('نكتب المعادلة',head,'المعادلة ميزان: كل عملية على طرف تُجرى على الآخر.','خاصية التساوي')];
if(/\(/.test(r.raw))m1.push(S('نفكّ الأقواس',M.poly(L,vn)+M.eq()+M.poly(Rr,vn),'أ(ب+ج) = أب + أج.','التوزيع'));
var cL=L.slice(),cR=Rr.slice();
if(!l0.zero()){var o=cancel(l0,vn),n0=r0.sub(l0);
m1.push(S(o.verb+' '+o.val.txt()+' '+o.prep+' الطرفين',M.poly(cL,vn)+o.h+M.eq()+M.poly(cR,vn)+o.h,
'نُلغي الحدّ الثابت من الطرف الأيسر بالعملية المعاكسة.','العملية المعاكسة'));

steps=[S('قاعدة الانسحاب',M.txt(rule),'الانسحاب يضيف شعاعًا ثابتًا لكل نقطة.','الانسحاب'),

else if(/دوران/.test(n)){var dm=(n.match(/(\d+)/g)||['90']).map(Number).filter(function(v){return [90,180,270].indexOf(v)>=0})[0]||90;
if(dm===90){rx=y.neg();ry=x}else if(dm===180){rx=x.neg();ry=y.neg()}else{rx=y;ry=x.neg()}
name='دوران '+dm+'°';rule=dm===90?'(x,y) → (−y, x)':dm===180?'(x,y) → (−x, −y)':'(x,y) → (y, −x)';
steps=[S('قاعدة الدوران حول المبدأ',M.txt(rule),'الدوران الموجب عكس عقارب الساعة.','الدوران'),

S('تحقّق الطويلة',M.root(M.q(x.mul(x).add(y.mul(y))))+M.eq()+M.root(M.q(rx.mul(rx).add(ry.mul(ry)))),'الدوران يحفظ المسافات.','التحويلات الحافظة')]}

else{var mode=/y=x/.test(n)?'yx':/الصادات|محور y/.test(n)?'y':/المبدأ|مركزي/.test(n)?'o':'x';
if(mode==='x'){rx=x;ry=y.neg();name='تناظر حول محور السينات';rule='(x,y) → (x, −y)'}
else if(mode==='y'){rx=x.neg();ry=y;name='تناظر حول محور الصادات';rule='(x,y) → (−x, y)'}

function classify(text){
var n=norm(text),low=n.toLowerCase(),rel=relation(n),ps=parts(text).filter(function(s){return s.indexOf('=')>=0});
if(ps.length>=3)return 'sys3';
if(ps.length===2)return 'sys';
if(/من أجل|بدلالة/.test(n))return 'literal';
if(/طاليس/.test(n))return 'thales';
if(/قانون\s*(الجيب|جيب التمام)|a=\d.*b=\d.*C=/.test(n))return 'tri';
if(/انسحاب|تناظر|دوران|تحاكي/.test(n))return 'trans';
if(/جداء\s*قياسي|طويلة\s*(الشعاع|شعاع)|زاوية\s*بين/.test(n))return 'vec';
if(/ميل|معادلة\s*مستقيم|معادلة\s*دائرة/.test(n)&&/\(\s*-?\d/.test(n))return 'coord';
if(/منتصف|مسافة|شعاع|إحداثيات/.test(n)&&/\(\s*-?\d/.test(n))return 'coord';
if(/\(\s*-?\d+\s*[,;]\s*-?\d+\s*\)/.test(n)&&/طويلة|جداء|زاوية|جمع/.test(n))return 'vec';
