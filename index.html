<style>
:root{

 --line:#D9D9D2;--red:#E3270E;--blue:#1D3FCC;--green:#0E7A3C;--amber:#B26A00;--magenta:#C0157A;--danger:#C81E1E;

}
html{font-size:calc(16px * var(--fs));-webkit-text-size-adjust:100%;scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 .94rem/1.8 var(--sans);overflow-x:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}

p{margin:0;overflow-wrap:break-word}a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;touch-action:manipulation}
img,svg,canvas{max-width:100%}ul{margin:0;padding:0;list-style:none}
::selection{background:var(--accent);color:var(--paper)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
*{scrollbar-width:thin;scrollbar-color:var(--ink) var(--paper2)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:var(--paper2)}
::-webkit-scrollbar-thumb{background:var(--ink);border:2px solid var(--paper2)}
::-webkit-scrollbar-thumb:hover{background:var(--accent)}
.mono{font-family:var(--mono);direction:ltr;unicode-bidi:isolate;font-weight:500}
.dim{color:var(--ink3)}[hidden]{display:none!important}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;

 background-size:24px 24px,24px 24px,120px 120px,120px 120px}
.bg::after{content:'';position:absolute;inset:0;background:var(--g-hero);opacity:.55}
.kick{font:500 .62rem/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:.45rem;margin-bottom:.5rem}
.kick::before{content:'';width:.45rem;height:.45rem;background:var(--accent);flex-shrink:0}

.tag.g{border-color:var(--green);color:var(--green)}.tag.r{border-color:var(--red);color:var(--red)}
.tag.a{border-color:var(--amber);color:var(--amber)}.tag.b{border-color:var(--blue);color:var(--blue)}.tag.m{border-color:var(--magenta);color:var(--magenta)}
.reveal{opacity:0;transform:translateY(14px);transition:opacity .55s cubic-bezier(.2,.8,.2,1),transform .55s cubic-bezier(.2,.8,.2,1);transition-delay:var(--d,0ms)}

.tabs button{flex:1 1 0;min-width:0;height:var(--tab);background:none;border:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15rem;font:600 .6rem var(--sans);color:var(--ink2);position:relative;padding:0 .1rem}

.shell{position:relative;z-index:1;padding-top:calc(var(--bar) + var(--ban));padding-bottom:calc(var(--tab) + var(--safe) + 1.2rem);padding-inline-start:var(--rail)}

.btn:hover{background:var(--ink);color:var(--paper)}.btn:active{transform:translate(1px,1px)}
.btn.p{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:3px 3px 0 var(--ink)}
.btn.p:hover{background:var(--ink);border-color:var(--ink);box-shadow:4px 4px 0 var(--accent)}

.fg{display:flex;flex-direction:column;gap:.3rem;margin-bottom:.7rem}

.chip.on{background:var(--ink);color:var(--paper)}
.search{display:flex;align-items:center;gap:.5rem;border:var(--rule);border-radius:var(--rad);background:var(--white);padding:0 .65rem;flex:1 1 10rem;min-height:2.75rem}

/* البطل والحل */
.hero{border:var(--rule);border-radius:var(--rad);background:var(--white);box-shadow:var(--hard);overflow:hidden;margin-bottom:1rem}

.stats b{display:block;font:700 1.2rem/1.2 var(--mono)}

.solve-grid{display:block}
.lbl{display:flex;justify-content:space-between;align-items:center;font-size:.74rem;font-weight:600;color:var(--ink2);margin:.85rem 0 .45rem}

   case 'recip':return y+M.frac(M.n(String(A)),M.v('س')+M.op(B>=0?'−':'+')+M.n(String(Math.abs(B))))+sg(Cc);
   case 'abs':return y+M.n(String(A))+M.abs(M.v('س')+M.op(B>=0?'−':'+')+M.n(String(Math.abs(B))))+sg(Cc);
   case 'exp':return y+M.n(String(A))+M.op('×')+M.sup(M.n('2'),M.n(String(B))+M.v('س'))+sg(Cc);
