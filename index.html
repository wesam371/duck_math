while((m=re.exec(n))!==null)v.push({x:Q.parse(m[1]),y:Q.parse(m[2])});
if(!v.length)throw new Err('اكتب أشعة مثل (3,4) و (1,2) مع: طويلة، جداء، زاوية، جمع.');
var u=v[0];
if(/طويلة|طول/.test(n)||v.length===1){var s=u.x.mul(u.x).add(u.y.mul(u.y)),mg=X.rad(R.sq(s));
return mk({topic:'vec',label:'طويلة شعاع',input:t,
steps:[S('القانون',M.fn('abs',M.v('u'))+M.e()+M.rt(M.sup('x','2')+M.o('+')+M.sup('y','2')),'فيثاغورس.','المعيار'),
S('نعوّض',M.rt(M.sup(M.q(u.x),'2')+M.o('+')+M.sup(M.q(u.y),'2')),'',''),S('نحسب',M.xa(mg),'','')],
answer:{h:M.xa(mg),t:xt(mg),x:mg}})}
var w=v[1];
if(/جداء|قياسي/.test(n)){var dt=u.x.mul(w.x).add(u.y.mul(w.y));
return mk({topic:'vec',label:'الجداء القياسي',input:t,
steps:[S('القانون',M.v('u')+M.o('·')+M.v('w')+M.e()+'x₁x₂+y₁y₂','نضرب المتناظرة ونجمع.','الجداء'),
S('نعوّض',M.q(u.x)+M.o('×')+M.q(w.x)+M.o('+')+M.q(u.y)+M.o('×')+M.q(w.y),'',''),
S('نحسب',M.q(dt),'',''),
S('الاستنتاج',M.tx(dt.z()?'متعامدان (الجداء=0)':'غير متعامدين'),'الجداء معدوم يكافئ التعامد.','التعامد')],
answer:{h:M.q(dt),t:dt.t(),x:X.q(dt)}})}
if(/زاوية/.test(n)){var d=u.x.mul(w.x).add(u.y.mul(w.y));
var mu=Math.sqrt(u.x.v()**2+u.y.v()**2),mw=Math.sqrt(w.x.v()**2+w.y.v()**2);
if(!mu||!mw)throw new Err('الشعاع الصفري لا يحدّد زاوية.');
var cs=Math.max(-1,Math.min(1,d.v()/(mu*mw))),dg=Math.acos(cs)*180/Math.PI;
return mk({topic:'vec',label:'الزاوية بين شعاعين',input:t,
steps:[S('القانون',M.fn('cos','θ')+M.e()+M.fr('u·w','|u|×|w|'),'من الجداء الهندسي.','الجداء والزاوية'),
S('نحسب',M.q(d)+M.sp+M.n(fmt(mu,4))+M.sp+M.n(fmt(mw,4)),'',''),S('acos',M.v('θ')+M.e()+M.n(fmt(dg,3)+'°'),'','')],
answer:{h:M.v('θ')+M.e()+M.n(fmt(dg,3)+'°'),t:fmt(dg,3)+'°'}})}
var sx=u.x.add(w.x),sy=u.y.add(w.y);
return mk({topic:'vec',label:'جمع شعاعين',input:t,
steps:[S('القانون',M.v('u')+M.o('+')+M.v('w')+M.e()+M.pa('x₁+x₂'+M.o(',')+'y₁+y₂'),'نجمع المتناظرة.','الجمع'),
S('نعوّض',M.pa(M.q(u.x)+M.o('+')+M.q(w.x)+M.o(',')+M.q(u.y)+M.o('+')+M.q(w.y)),'',''),
S('النتيجة',M.pa(M.q(sx)+M.o(',')+M.q(sy)),'','')],
answer:{h:M.pa(M.q(sx)+M.o(',')+M.q(sy)),t:'('+sx.t()+' , '+sy.t()+')',x:X.q(sx)}})};
SOL.trans=function(t){
var n=norm(t),m=n.match(/\(\s*(-?\d+(?:\.\d+)?)\s*[,;]\s*(-?\d+(?:\.\d+)?)\s*\)/);
if(!m)throw new Err('اكتب نقطة (3,4) والتحويل: انسحاب، تناظر، دوران، تحاكي.');
var x=Q.parse(m[1]),y=Q.parse(m[2]),rx,ry,nm,rule,steps;
if(/انسحاب/.test(n)){var al=nums(n),a=al[2]||q(2n),b=al[3]||q(3n);
rx=x.add(a);ry=y.add(b);nm='انسحاب';rule='(x,y)→(x+a, y+b)';
steps=[S('القاعدة',M.tx(rule),'يضيف شعاعًا ثابتًا.','الانسحاب'),
S('نعوّض',M.pa(M.q(x)+M.o('+')+M.q(a)+M.o(',')+M.q(y)+M.o('+')+M.q(b)),'',''),S('الصورة',M.pa(M.q(rx)+M.o(',')+M.q(ry)),'','')]}
else if(/دوران/.test(n)){var dm=(n.match(/(\d+)/g)||['90']).map(Number).filter(function(v){return [90,180,270].indexOf(v)>=0})[0]||90;
if(dm===90){rx=y.neg();ry=x}else if(dm===180){rx=x.neg();ry=y.neg()}else{rx=y;ry=x.neg()}
nm='دوران '+dm+'°';rule=dm===90?'(x,y)→(−y,x)':dm===180?'(x,y)→(−x,−y)':'(x,y)→(y,−x)';
steps=[S('القاعدة',M.tx(rule),'الموجب عكس عقارب الساعة.','الدوران'),S('الصورة',M.pa(M.q(rx)+M.o(',')+M.q(ry)),'',''),
S('حفظ الطويلة',M.rt(M.q(x.mul(x).add(y.mul(y))))+M.e()+M.rt(M.q(rx.mul(rx).add(ry.mul(ry)))),'الدوران يحفظ المسافات.','حافظة')]}
else if(/تحاكي|تكبير/.test(n)){var k=lbl(n,['نسبة','معامل'])||q2;
rx=x.mul(k);ry=y.mul(k);nm='تحاكي '+k.t();rule='(x,y)→(kx,ky)';
steps=[S('القاعدة',M.tx(rule),'يضرب الإحداثيات في النسبة.','التحاكي'),S('الصورة',M.pa(M.q(rx)+M.o(',')+M.q(ry)),'',''),
S('الأثر',M.tx(k.abs().v()>1?'تكبير':'تصغير'),'|k|>1 تكبير.','النسبة')]}
else{var md=/y=x/.test(n)?'yx':/الصادات|محور y/.test(n)?'y':/المبدأ|مركزي/.test(n)?'o':'x';
if(md==='x'){rx=x;ry=y.neg();nm='تناظر حول السينات';rule='(x,y)→(x,−y)'}
else if(md==='y'){rx=x.neg();ry=y;nm='تناظر حول الصادات';rule='(x,y)→(−x,y)'}
else if(md==='yx'){rx=y;ry=x;nm='تناظر حول y=x';rule='(x,y)→(y,x)'}
else{rx=x.neg();ry=y.neg();nm='تناظر مركزي';rule='(x,y)→(−x,−y)'}
steps=[S('القاعدة',M.tx(rule),'يعكس الإشارة.','التناظر'),S('الصورة',M.pa(M.q(rx)+M.o(',')+M.q(ry)),'',''),
S('حفظ المسافة',M.tx('محفوظة'),'التناظر تحويل حافظ.','حافظة')]}
return mk({topic:'trans',label:nm,input:t,steps:steps,answer:{h:M.pa(M.q(rx)+M.o(',')+M.q(ry)),t:'('+rx.t()+' , '+ry.t()+')'}})};

function classify(text){
var n=norm(text),lo=n.toLowerCase(),r=rel(n),ps=parts(text).filter(function(s){return s.indexOf('=')>=0});
if(ps.length>=2)return 'sys';
if(/طاليس/.test(n))return 'thales';
if(/انسحاب|تناظر|دوران|تحاكي/.test(n))return 'trans';
if(/جداء|طويلة\s*(الشعاع|شعاع)|زاوية\s*بين/.test(n))return 'vec';
if(/ميل|معادلة\s*مستقيم|منتصف|مسافة|شعاع|إحداثيات/.test(n)&&/\(\s*-?\d/.test(n))return 'coord';
if(/\(\s*-?\d+\s*[,;]\s*-?\d+\s*\)/.test(n)&&/طويلة|جداء|زاوية|جمع/.test(n))return 'vec';
if(/محدد|مصفوفة/.test(n))return 'det';
if(/سابقة|صورة|مجال|مقلوب/.test(n)&&/=/.test(n))return 'func';
if(/[A-Za-z]\s*\(\s*[A-Za-z\u0621-\u064A]\s*\)\s*=/.test(n))return 'func';
if(/(sin|cos|tan)\s*\(?[A-Za-z\u0621-\u064A]\)?\s*=/.test(lo))return 'trigEq';
if(/\^\s*\(?[A-Za-z\u0621-\u064A]/.test(n)&&/=/.test(n))return 'expEq';
if(/abs\(/.test(n)&&/=/.test(n))return 'absEq';
if(/(√|sqrt)/.test(n)&&/=/.test(n))return 'radEq';
if(r&&/[<>≤≥]/.test(r.o))return 'ineq';
if(/حلل|تحليل/.test(n)&&/[A-Za-z\u0621-\u064A]/.test(n)&&!/عوامل أولية|ق\.م\.أ/.test(n))return 'poly';
if(/اقسم|قسمة/.test(n)&&/[A-Za-z\u0621-\u064A]/.test(n))return 'poly';
if(/انشر|فك|متطابقة/.test(n))return 'poly';
if(r&&r.o==='='){try{
var vs=vars(parse(tm(r.l))).concat(vars(parse(tm(r.r))));
vs=vs.filter(function(v,i){return vs.indexOf(v)===i});
if(vs.length===1){var P=psub(poly(parse(tm(r.l)),vs[0],4),poly(parse(tm(r.r)),vs[0],4));
var d=deg(P);if(d>=3)return 'cubic';if(d===2)return 'quad';return 'linear'}
if(!vs.length)return 'arith'}catch(e){}
return 'linear'}
if(/احتمال/.test(n))return 'prob';
if(/توافيق|تباديل|مضروب|!/.test(n))return 'comb';
if(/متتالية|حسابية|هندسية/.test(n))return 'seq';
if(/ق\.م\.أ|م\.م\.أ|قاسم|مضاعف|عوامل أولية/.test(n))return 'gcd';
if(/سرعة|كم في|ينجز/.test(n))return 'rate';
if(/%|٪|مئوية|خصم|زيادة|تخفيض/.test(n))return 'pct';
if(/حجم|مساحة\s*(السطح|الكلية)|كرة|مخروط|هرم|أسطوانة|اسطوانة|مكعب|متوازي مستطيلات/.test(n))return 'solid';
if(/مساحة|محيط/.test(n))return 'shape';
if(/فيثاغورس|قائم|الوتر/.test(n))return 'pyth';
if(/(sin|cos|tan)/.test(lo))return 'trig';
if(/(√|جذر)/.test(n)&&!/[A-Za-z\u0621-\u064A]\s*=/.test(n))return 'rad';
if(/abs\(/.test(n))return 'abs';
if(/\^/.test(n))return 'pow';
if(/\d\s*\/\s*\d/.test(n))return 'frac';
if(/[A-Za-z\u0621-\u064A]/.test(n)&&/[+\-*/]/.test(n))return 'poly';
return 'arith'}
function verify(sol,raw){
try{var r=rel(raw);
if(r&&r.o==='='&&sol.answer&&sol.answer.x){
var vs=vars(parse(tm(r.l)));
if(vs.length===1){var env={};env[vs[0]]=sol.answer.x;
var L=ev(parse(tm(r.l)),env),Rr=ev(parse(tm(r.r)),env);
var ok=Math.abs(L.v()-Rr.v())<1e-8;
return{h:M.xa(L)+M.e()+M.xa(Rr),ok:ok,w:ok?'عوّضنا الحلّ في الطرفين الأصليين فتساويا ✔':'التعويض لم يعطِ تساويًا.'}}}
if(sol.answer&&sol.answer.x)return{h:M.xa(sol.answer.x)+M.sp+M.o('≈')+M.n(fmt(sol.answer.x.v(),8)),ok:true,w:'أُعيد حساب القيمة من التعبير الأصلي مستقلًّا عن الخطوات.'}}catch(e){}
return null}
function solve(text){
var raw=String(text==null?'':text).trim();
if(!raw)throw new Err('اكتب مسألة أو اختر قالبًا.');
var key=classify(raw),out=null,err=null;
try{out=SOL[key](raw)}catch(e){err=e;
var fb=['linear','quad','arith','shape','frac','poly'];
for(var i=0;i<fb.length;i++){if(fb[i]===key)continue;try{out=SOL[fb[i]](raw);break}catch(e2){}}}
if(!out)throw new Err((err&&err.message?err.message:'صيغة غير مفهومة')+' — جرّب قالبًا جاهزًا.');
var meta=TOPICS.filter(function(t){return t.id===out.topic})[0];
if(meta){out.unit=meta.u;out.lesson=meta.n}
out.verify=out.verify||verify(out,raw);
return out}

function grade(pr,raw){
var t=norm(raw).replace(/\s/g,''),val=null,ex=null;
var f=t.match(/^(-?\d+)\/(-?\d+)$/);
if(f){try{var qq=new Q(BigInt(f[1]),BigInt(f[2]));val=qq.v();ex=qq.t()}catch(e){}}
if(val===null){var s=t.match(/^(-?\d*)√(\d+)$/);
if(s){var co=s[1]==='-'?-1:s[1]===''?1:Number(s[1]);val=co*Math.sqrt(Number(s[2]))}}
if(val===null){var nv=Number(t);if(isFinite(nv)&&t!=='')val=nv}
if(val===null)return{ok:false,kind:'no',msg:'اكتب عددًا أو كسرًا مثل 3/4 أو جذرًا مثل 6√2.'};
var tg=pr.coeff!==undefined?pr.coeff:pr.value,tol=pr.tol||1e-6;
if(Math.abs(val-tg)<=tol){var uns=ex&&pr.exact&&ex!==pr.exact;
return{ok:true,msg:uns?'صحيح ✔ لكن يُختصر إلى '+pr.exact+'.':'إجابة صحيحة ✔'}}
if(pr.alt!==undefined&&Math.abs(val-pr.alt)<=tol)return{ok:true,msg:'صحيح ✔ (الجذر الآخر)'};
var ms=pr.mistakes||[];
for(var i=0;i<ms.length;i++){var mv=Number(ms[i].v);
if(isFinite(mv)&&Math.abs(val-mv)<=Math.max(tol,1e-6))return{ok:false,kind:'diag',msg:'خطأ شائع: '+ms[i].msg}}
return{ok:false,kind:'no',msg:'ليست صحيحة بعد. راجع الخطوة الأولى.'}}
function hints(pr,sol,lv){
if(!sol||!sol.steps.length)return['ابدأ بترتيب المسألة.'];
var s=sol.steps;
if(lv<=1)return[s[0].t+(s[0].w?' — '+s[0].w:'')];
if(lv===2)return s.slice(0,2).map(function(x){return x.t+(x.w?' — '+x.w:'')});
return s.slice(0,4).map(function(x){return x.t+(x.r?' ['+x.r+']':'')})}

function f(){var a=P.a,b=P.b,c=P.c;
if(P.type==='linear')return function(x){return a*x};
if(P.type==='quad')return function(x){return a*x*x+b*x+c};
if(P.type==='abs')return function(x){return a*Math.abs(x-b)+c};
if(P.type==='sine')return function(x){return a*Math.sin((b*x)*Math.PI/180)};
if(P.type==='recip')return function(x){return Math.abs(x-b)<1e-6?NaN:a/(x-b)+c};
return function(x){return a*x+b}}
function eq(){var A=rnd(P.a,1),B=rnd(P.b,1),C=rnd(P.c,1);
function sg(v){return M.o(v>=0?'+':'−')+M.n(String(Math.abs(rnd(v,1))))}
var y=M.n('y')+M.e();
if(P.type==='linear')return y+M.n(String(A))+M.v('س');
if(P.type==='quad')return y+M.n(String(A))+M.sup(M.v('س'),'2')+sg(B)+M.v('س')+sg(C);
if(P.type==='abs')return y+M.n(String(A))+'|'+M.v('س')+M.o(B>=0?'−':'+')+M.n(String(Math.abs(B)))+'|'+sg(C);
if(P.type==='sine')return y+M.n(String(A))+M.fn('sin',M.n(String(B))+M.v('س')+'°');
if(P.type==='recip')return y+M.fr(M.n(String(A)),M.v('س')+M.o(B>=0?'−':'+')+M.n(String(Math.abs(B))))+sg(C);
return y+M.n(String(A))+M.v('س')+sg(B)}

cx.fillStyle='#4C4C48';cx.font='500 10px monospace';cx.textAlign='center';cx.textBaseline='top';
var y0=Math.max(0,Math.min(H-14,sy(0)));
for(x=Math.ceil(wx(0)/s)*s;x<=wx(W);x+=s){if(Math.abs(x)<1e-9)continue;cx.fillText(String(rnd(x,2)),sx(x),y0+4)}
cx.textAlign='right';cx.textBaseline='middle';var x0=Math.max(30,Math.min(W-4,sx(0)));

if(P.fill){cx.save();cx.fillStyle=P.col+'22';cx.beginPath();var st=false;
for(var q=0;q<=W;q+=2){var v=fn(wx(q));if(!isFinite(v))continue;

r.steps.map(stHTML).join('')+
(r.verify?'<div class="vbox'+(r.verify.ok?'':' bad')+'"><h4>التحقّق</h4>'+M.bl(r.verify.h,'start')+'<p>'+esc(r.verify.w||'')+'</p></div>':'')+

renderNb();

var d=e.target.closest('[data-del]');if(d){nbDel(d.dataset.del);return}
var o=e.target.closest('[data-open]');if(o){nbOpen(o.dataset.open);return}
var c=e.target.closest('.card');if(c)nbOpen(c.dataset.id)}}
/* ===== المساعد ===== */
function fmtMsg(t){return esc(t).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').split('\n').filter(Boolean).map(function(l){return '<div>'+l+'</div>'}).join('')}
function addMsg(t,me){var e=document.createElement('div');e.className='msg'+(me?' me':'');e.innerHTML=fmtMsg(t);
var l=$('#lg');l.appendChild(e);l.scrollTop=l.scrollHeight;return e}
function answer(qy){var n=norm(qy).toLowerCase();
if(/لماذا|سبب|القاعدة/.test(n)&&ST.cur){var s=steps()[Math.max(0,ST.rev-1)];
return '**في مسألتك: '+ST.cur.input+'**\n'+s.t+'\n'+(s.w||'')+(s.r?'\nالقاعدة: '+s.r:'')+'\nالنتيجة: '+ST.cur.answer.t}
try{if(/[=+\-*/^%√;؛]|مساحة|محيط|حجم|متوسط|حلل|انشر|جذر|قائم|طاليس|sin|cos|tan|شعاع|منتصف|مسافة|سابقة|صورة|احتمال|توافيق|متتالية|محدد/.test(qy)){
var so=solve(qy);go('solve');setTimeout(function(){ST.cur=so;ST.rev=so.steps.length;ST.meth=0;render()},200);
return '**حللتها بالمحرّك ✔**\n'+so.label+'\nالنتيجة: '+so.answer.t+'\n\n'+
so.steps.map(function(s,i){return (i+1)+') '+s.t+(s.r?' ['+s.r+']':'')}).join('\n')+
(so.verify?'\n\nالتحقّق: '+(so.verify.ok?'ناجح ✔':'راجع'):'')}}catch(e){}
var best=null,sc=0;
TOPICS.forEach(function(t){var s=t.k.reduce(function(a,w){return a+(n.indexOf(w.toLowerCase())>=0?1:0)},0);
if(s>sc){sc=s;best=t}});
if(best)return '**'+best.n+'**\n'+best.d+'\nجرّب: '+best.ex;
return 'أشرح قواعد '+TOPICS.length+' درسًا. اسأل عن النقل وعكس الإشارة، المميّز، جدول الإشارة، الحلول الدخيلة، طاليس، فيثاغورس، sin_cos_tan، الجداء القياسي، أو التحويلات.\nأو اكتب مسألة مباشرة.'}
function ask(text){var t=(text!==undefined?text:$('#ci').value).trim();if(!t)return;
if(text===undefined)$('#ci').value='';
addMsg(t,true);SND.play('tap');
setTimeout(function(){addMsg(answer(t))},250)}
function wireAI(){$('#lg').innerHTML='';
addMsg('أهلًا بك. المحرّك يغطّي '+TOPICS.length+' نوعًا بحساب مضبوط وتحقّق مستقلّ.\nجرّب «لماذا نعكس الإشارة؟» أو اكتب 2ع+5=13.');
$('#cs2').onclick=function(){ask()};
$('#ci').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask()}})}
/* ===== الإقلاع ===== */
$('#snd').onclick=function(){SND.on=!SND.on;LS.set('snd',SND.on);
$('#snd').style.opacity=SND.on?'1':'.45';toast(SND.on?'الصوت مفعّل':'تم الكتم')};
$('#snd').style.opacity=SND.on?'1':'.45';
window.addEventListener('keydown',function(e){
if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();go('solve');setTimeout(function(){$('#inp').focus()},200)}});
try{build();go('solve')}catch(e){
$('#views').innerHTML='<div class="panel" style="margin:20px"><h3 style="color:#C81E1E">خطأ في التشغيل</h3>'+
'<p style="font-family:var(--mono);direction:ltr;font-size:13px;margin-top:8px">'+esc(e.message)+'</p>'+
'<p style="margin-top:10px;font-size:13px">افتح F12 → Console وأرسل الرسالة.</p></div>';
$('.view')&&$('.view').classList.add('on')}
})();
